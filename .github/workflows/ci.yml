name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      # govulncheck — scans for known vulnerabilities in dependencies
      # and in the Go standard library used by this project.
      # Fails if any known vulnerability affects reachable code.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      # gosec — static analysis for common security problems in Go code.
      # Checks for: hardcoded credentials, SQL injection vectors,
      # insecure random number usage, unsafe file permissions,
      # unhandled errors on security-sensitive calls, and more.
      # AI-generated code is statistically 2.74x more vulnerable than
      # human-written code — this gate catches the common patterns.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec -fmt=sarif -out=results.sarif -exclude-dir=tests ./...
        # -fmt=sarif -out=results.sarif: machine-readable output consumed by
        # the security-review skill (workflow/security-review/SKILL.md) to
        # generate plain-English explanations and fix proposals per finding.
        # GOSEC_AI_API_KEY (set in repo secrets) enables AI fix suggestions
        # in the skill — not used by CI directly.
        # tests/ directory excluded: integration test fixtures may contain
        # intentionally insecure patterns for testing error conditions
        # (Phase B gate round 4 fix, 2026-07-05: this flag previously read
        # -exclude-dir=test, singular, which doesn't match this project's
        # actual tests/ directory and so silently excluded nothing —
        # Codex round-4 finding N3.)
        #
        # No CodeQL SARIF-upload step here (Phase D CI-fix, 2026-07-07):
        # gosec's own non-zero exit already fails this job on any finding —
        # that's the actual pass/fail gate. The SARIF upload was additive
        # (machine-readable findings in the Security tab) and was failing
        # CI outright because the job had no security-events: write
        # permission and github/codeql-action/upload-sarif had nothing to
        # read when a prior step didn't produce the file. Simpler-for-a-
        # throwaway fix: keep gosec as a plain pass/fail gate, drop the
        # upload. Re-add with permissions.security-events: write (already
        # present on this job below) if the SARIF Security-tab view is ever
        # wanted later.

      # semgrep — pattern-based static analysis covering OWASP Top 10,
      # secrets detection, and Go-specific anti-patterns not caught by gosec.
      # Complements gosec (rule-based) and govulncheck (dependency CVEs).
      # AI-generated code is particularly prone to: missing input validation,
      # insecure defaults, and copy-pasted patterns with embedded credentials.
      - name: Install semgrep
        run: pip install semgrep --break-system-packages

      - name: Run semgrep
        run: semgrep --config=auto .
        # "." not "./..." -- ./... is Go's package-glob syntax, which
        # semgrep doesn't accept as a scan root (it failed with "Invalid
        # scanning root", exit 2). semgrep wants a real filesystem path;
        # "." (repo root, same scope as Go's ./... in practice) is correct.
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: false
        # semgrep's default exit code is non-zero when it reports findings,
        # which is the actual pass/fail gate for this job — same reasoning
        # as gosec above. No SARIF output/upload step (dropped, same fix,
        # same permission/missing-file problem).

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Run unit tests
        run: go test ./... -count=1 -race -coverprofile=coverage.out
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Build all binaries
        run: go build ./cmd/...

  frontend-test:
    name: Frontend unit tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run Vitest
        run: npm test
        # EXPECTED RED until Phase F (issue #6) lands — the locked test
        # files this Pre-Phase F session committed
        # (web/src/**/*.test.tsx) import App/AddBar/Card/deriveNeighbors,
        # none of which exist yet. Same exception CLAUDE.md's
        # CI-GREEN-ON-MAIN checklist documents for a pre-committed Go
        # test file referencing unimplemented modules, applied to the
        # frontend for the first time.

  frontend-e2e:
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trailhead_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Build the SPA
        working-directory: web
        run: npm run build
      - name: Build the trailhead binary
        # -tags spa: the SPA is only embedded in a tagged build (see
        # cmd/trailhead/spa_embed.go / spa_stub.go) — plain, untagged
        # `go build` (used by the lint/test/build jobs above) deliberately
        # never requires web/'s build output to exist.
        run: go build -tags spa -o bin/trailhead ./cmd/trailhead
      - name: Run Playwright specs
        working-directory: web
        run: npx playwright test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/trailhead_e2e?sslmode=disable
        # EXPECTED RED until Phase F (issue #6) lands — two things are
        # both still Phase B placeholders: `npm run build` has no
        # App.tsx to build (web/dist won't exist), and
        # cmd/trailhead/main.go has no go:embed, no Postgres wiring, and
        # no RunMigrations call (see the UI Contract's "cmd/trailhead
        # requirements" in docs/issues/06-frontend-board-add-bar.md).
        # Both must land before this job can pass.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # All six jobs must pass for a PR to be mergeable (frontend-test and
  # frontend-e2e added at issue #6 Pre-Phase F, 2026-08-07 — see their own
  # EXPECTED RED notes above; that exception is temporary, scoped to
  # exactly the Phase F PR that resolves it, same as every other
  # pre-committed-locked-test red on this project).
  # Security is not optional. A PR that introduces a known vulnerability
  # or a gosec finding is rejected automatically, not flagged for review.
  #
  # Blast radius context:
  # If a security finding appears in a Tier 1 package (auth, credentials,
  # data writes), treat it as P1 — do not merge with an exception.
  # If it appears in a Tier 3 package (formatters, utilities), assess
  # whether it is a true positive before deciding.
